[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "slopguard"
version = "0.1.0"
description = "Catch AI coding slop before it hits main: hallucinated imports, phantom packages, silent failures, test cheating, leaked secrets, and prompt injections."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    {name = "SlopGuard Contributors"}
]
keywords = ["ai", "linter", "security", "slopsquatting", "static-analysis", "claude-code", "pre-commit", "sarif", "mcp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Security",
]
dependencies = []

[project.scripts]
slopguard = "slopguard.cli:main"

[project.urls]
Homepage = "https://github.com/vtg0071/slopguard"
Repository = "https://github.com/vtg0071/slopguard"
Issues = "https://github.com/vtg0071/slopguard/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
slopguard = ["py.typed", "data/*.md"]

[tool.slopguard]
fail-on = "high"
ignore = [
    "examples/**",
    ".venv/**",
    "node_modules/**",
    "dist/**",
    "build/**",
]
