name: "SlopGuard"
description: "Catch AI coding slop before it hits main: phantom imports, hallucinated APIs, stubs, silent failures, test cheating, secrets, and prompt injections."
author: "SlopGuard Contributors"
branding:
  icon: "shield"
  color: "purple"

inputs:
  target:
    description: "Path to scan"
    required: false
    default: "."
  fail-on:
    description: "Minimum severity to fail CI (critical, high, medium, low, none)"
    required: false
    default: "high"
  diff:
    description: "Optional git ref for PR diff scoping (e.g. origin/main)"
    required: false
    default: ""
  verify-registry:
    description: "Verify declared PyPI/npm packages against live registries"
    required: false
    default: "false"
  comment-pr:
    description: "Post SlopGuard Markdown summary on pull requests"
    required: false
    default: "true"
  sarif-file:
    description: "Optional path to write SARIF output"
    required: false
    default: "slopguard.sarif"

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    - name: Install SlopGuard
      shell: bash
      run: pip install "${{ github.action_path }}"
    - name: Run SlopGuard
      shell: bash
      run: |
        EXTRA_ARGS=""
        if [ -n "${{ inputs.diff }}" ]; then EXTRA_ARGS="$EXTRA_ARGS --diff ${{ inputs.diff }}"; fi
        if [ "${{ inputs.verify-registry }}" = "true" ]; then EXTRA_ARGS="$EXTRA_ARGS --verify-registry"; fi
        slopguard check "${{ inputs.target }}" $EXTRA_ARGS --format sarif --output "${{ inputs.sarif-file }}" --fail-on none
        slopguard check "${{ inputs.target }}" $EXTRA_ARGS --format markdown --output slopguard-pr-comment.md --fail-on none
        slopguard check "${{ inputs.target }}" $EXTRA_ARGS --fail-on "${{ inputs.fail-on }}"
    - name: Comment on PR
      if: always() && github.event_name == 'pull_request' && inputs.comment-pr == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        if [ -f slopguard-pr-comment.md ]; then
          gh pr comment "${{ github.event.pull_request.number }}" --body-file slopguard-pr-comment.md || true
        fi
